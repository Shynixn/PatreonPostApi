name: Apps

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '--release')
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          tag_name: v1.0.${{ github.run_number }}
          release_name: Papoa v1.0.${{ github.run_number }}

  build:
    name: Build (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: [create-release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '--release')
    strategy:
      matrix:
        rid:
          - linux-x64
          - linux-arm64
          - osx-x64
          - osx-arm64
          - win-x64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (${{ matrix.rid }})
        run: |
          dotnet publish papoa.cli/papoa.cli.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --output publish/${{ matrix.rid }}

      - name: Determine artifact name
        id: artifact
        run: |
          if [[ "${{ matrix.rid }}" == "win-x64" ]]; then
            echo "asset_path=publish/${{ matrix.rid }}/papoa.exe" >> $GITHUB_OUTPUT
            echo "asset_name=papoa-${{ matrix.rid }}.exe" >> $GITHUB_OUTPUT
          else
            echo "asset_path=publish/${{ matrix.rid }}/papoa" >> $GITHUB_OUTPUT
            echo "asset_name=papoa-${{ matrix.rid }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Release (${{ matrix.rid }})
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.artifact.outputs.asset_path }}
          asset_name: ${{ steps.artifact.outputs.asset_name }}
          asset_content_type: application/octet-stream

  build-chromeextension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    needs: [create-release]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '--release')

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci
        working-directory: papoa.chromeextension

      - name: Build extension
        run: npm run build
        working-directory: papoa.chromeextension

      - name: Package extension zip
        run: |
          mkdir -p publish/chromeextension/node_modules/bootstrap/dist/css
          cp papoa.chromeextension/manifest.json publish/chromeextension/
          cp papoa.chromeextension/popup.html publish/chromeextension/
          cp papoa.chromeextension/styles.css publish/chromeextension/
          cp papoa.chromeextension/icon.png publish/chromeextension/
          cp -r papoa.chromeextension/dist publish/chromeextension/
          cp papoa.chromeextension/node_modules/bootstrap/dist/css/bootstrap.min.css publish/chromeextension/node_modules/bootstrap/dist/css/
          (
            cd publish/chromeextension
            zip -r ../papoa-chromeextension.zip .
          )

      - name: Upload extension zip to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: publish/papoa-chromeextension.zip
          asset_name: papoa-chromeextension.zip
          asset_content_type: application/zip
